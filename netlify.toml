[build]
  command = "node -e \"const fs=require('fs'); if(fs.existsSync('build.js')) { require('./build.js'); } else { if(!fs.existsSync('public')) fs.mkdirSync('public',{recursive:true}); if(!fs.existsSync('netlify/functions')) fs.mkdirSync('netlify/functions',{recursive:true}); if(fs.existsSync('index.html')) fs.copyFileSync('index.html','public/index.html'); if(!fs.existsSync('public/_redirects')) fs.writeFileSync('public/_redirects','/api/*  /.netlify/functions/api/:splat  200!\\n/*  /index.html  200\\n'); }\""
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg", "bcryptjs"]

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/healthz"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/ping"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
